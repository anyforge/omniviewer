[package]
name = "omniviewer-core"
version = "0.5.0"
description = "Omniviewer 核心库：抽取 + 索引 + 搜索 + 水印 + 缓存 + 状态（GUI 与 CLI 共用）"
authors = ["AnyForge"]
edition = "2024"

[lib]
name = "omniviewer_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
jieba-rs = "0.11.0"
zip = "9.0.5"
pdf-extract = "0.12.1"
parquet = { version = "60.0.0", features = ["arrow"] }
arrow = { version = "60.0.0", features = ["ipc", "prettyprint"] }
